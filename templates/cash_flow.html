{% extends "base.html" %}

{% block content %}
<h2>Cash Flow Forecast</h2>

<table>
    <thead>
        <tr>
            <th>Date</th>
            <th>Description</th>
            <th class="right">Amount</th>
            <th class="right">Forecast Balance</th>
        </tr>
    </thead>

    <tbody>
        {% for row in rows %}
        <tr>
            <td>{{ row.date }}</td>
            <td>{{ row.description }}</td>
            <td class="right {{ 'positive' if row.amount > 0 else 'negative' }}">
                {{ row.amount | money }}
            </td>
            <td class="right">{{ row.balance | money }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
